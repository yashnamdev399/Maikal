<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <style>.t{fill:none;stroke-width:1.5;opacity:0.18;}</style>
  </defs>
  <!-- Tribal Gond-style circular motifs -->
  <g stroke="#4ab8d4" class="t">
    <circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="40"/><circle cx="100" cy="100" r="20"/>
    <line x1="100" y1="40" x2="100" y2="160"/><line x1="40" y1="100" x2="160" y2="100"/>
    <line x1="57" y1="57" x2="143" y2="143"/><line x1="143" y1="57" x2="57" y2="143"/>
  </g>
  <g stroke="#0a7a6e" class="t">
    <circle cx="700" cy="100" r="70"/><circle cx="700" cy="100" r="50"/><circle cx="700" cy="100" r="30"/>
    <line x1="700" y1="30" x2="700" y2="170"/><line x1="630" y1="100" x2="770" y2="100"/>
    <line x1="650" y1="50" x2="750" y2="150"/><line x1="750" y1="50" x2="650" y2="150"/>
  </g>
  <g stroke="#e8820a" class="t">
    <circle cx="400" cy="80" r="50"/><circle cx="400" cy="80" r="35"/><circle cx="400" cy="80" r="18"/>
    <line x1="400" y1="30" x2="400" y2="130"/><line x1="350" y1="80" x2="450" y2="80"/>
  </g>
  <!-- Peacock feather motifs (tribal MP style) -->
  <g stroke="#4ab8d4" class="t">
    <ellipse cx="150" cy="400" rx="30" ry="80"/>
    <ellipse cx="150" cy="400" rx="18" ry="55"/>
    <ellipse cx="150" cy="400" rx="8" ry="30"/>
    <line x1="150" y1="320" x2="150" y2="480"/>
  </g>
  <g stroke="#0a7a6e" class="t">
    <ellipse cx="650" cy="400" rx="30" ry="80"/>
    <ellipse cx="650" cy="400" rx="18" ry="55"/>
    <ellipse cx="650" cy="400" rx="8" ry="30"/>
    <line x1="650" y1="320" x2="650" y2="480"/>
  </g>
  <!-- Leaf/vine patterns -->
  <g stroke="#5cb85c" class="t">
    <path d="M200,600 Q250,550 300,600 Q350,650 400,600 Q450,550 500,600 Q550,650 600,600"/>
    <path d="M200,620 Q250,570 300,620 Q350,670 400,620 Q450,570 500,620 Q550,670 600,620"/>
    <circle cx="250" cy="575" r="8"/><circle cx="350" cy="625" r="8"/>
    <circle cx="450" cy="575" r="8"/><circle cx="550" cy="625" r="8"/>
  </g>
  <!-- Bottom tribal border -->
  <g stroke="#e8820a" class="t">
    <path d="M0,750 L50,720 L100,750 L150,720 L200,750 L250,720 L300,750 L350,720 L400,750 L450,720 L500,750 L550,720 L600,750 L650,720 L700,750 L750,720 L800,750"/>
    <path d="M0,770 L50,740 L100,770 L150,740 L200,770 L250,740 L300,770 L350,740 L400,770 L450,740 L500,770 L550,740 L600,770 L650,740 L700,770 L750,740 L800,770"/>
  </g>
  <!-- Dot fill patterns (Gond art style) -->
  <g fill="#4ab8d4" opacity="0.12">
    <circle cx="80" cy="300" r="3"/><circle cx="100" cy="310" r="3"/><circle cx="120" cy="300" r="3"/>
    <circle cx="90" cy="320" r="3"/><circle cx="110" cy="320" r="3"/>
    <circle cx="680" cy="300" r="3"/><circle cx="700" cy="310" r="3"/><circle cx="720" cy="300" r="3"/>
    <circle cx="690" cy="320" r="3"/><circle cx="710" cy="320" r="3"/>
  </g>
  <g fill="#0a7a6e" opacity="0.12">
    <circle cx="380" cy="200" r="3"/><circle cx="400" cy="210" r="3"/><circle cx="420" cy="200" r="3"/>
    <circle cx="390" cy="220" r="3"/><circle cx="410" cy="220" r="3"/>
  </g>
</svg>
